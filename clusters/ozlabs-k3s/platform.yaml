# Builds ./platform: the platform components. Each component is pinned in Git.
# A switched component (the Wiz integration, platform/wiz/switch.yaml) keeps its
# always-on parts here and puts the rest behind a switch Kustomization, like a
# target's. Switch values come from the ozlabs-targets ConfigMap; if it is
# absent, every switched component is off. No health check: the existing
# Kustomizations set none either.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform
  prune: true
  postBuild:
    substituteStrategy: Always
    substituteFrom:
      - kind: ConfigMap
        name: ozlabs-targets
        optional: true
