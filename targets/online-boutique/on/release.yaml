# Deploys the application's kustomize tree. No postBuild here: the upstream
# manifests are applied as published. The ${...} below is substituted by the
# parent switch Kustomization when it applies this file.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: online-boutique-app
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: online-boutique
  path: ./kustomize
  targetNamespace: online-boutique
  prune: true
  # Component paths are relative to spec.path (./kustomize). non-public-frontend
  # deletes the frontend-external LoadBalancer Service: nothing is exposed
  # outside the cluster.
  components:
    - components/non-public-frontend
  patches:
    - target:
        kind: Deployment
        name: loadgenerator
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: loadgenerator
        spec:
          replicas: ${TARGET_ONLINE_BOUTIQUE_LOADGEN_REPLICAS:=1}
